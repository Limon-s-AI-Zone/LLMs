<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 650" width="100%" height="100%" style="font-family: 'Segoe UI', Arial, sans-serif; background-color: #f8f9fa;">
  
  <defs>
    <!-- Standard Arrowhead -->
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#495057" />
    </marker>
    <!-- Cross-Attention Arrowhead -->
    <marker id="arrowhead-cross" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6f42c1" />
    </marker>
    <!-- Residual Arrowhead (Orange) -->
    <marker id="arrowhead-res" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e8590c" />
    </marker>
  </defs>

  <!-- Title -->
  <text x="400" y="30" font-size="24" font-weight="bold" fill="#212529" text-anchor="middle">Transformer Architecture with Residual Connections</text>
  <text x="250" y="60" font-size="14" font-weight="bold" fill="#e8590c" text-anchor="middle">- - - Residual (Skip) Connections</text>

  <!-- ========================================== -->
  <!-- ENCODER (Left Side) -->
  <!-- ========================================== -->
  <g id="encoder">
    <text x="250" y="100" font-size="18" font-weight="bold" fill="#004085" text-anchor="middle">Encoder</text>
    
    <!-- Container -->
    <rect x="100" y="110" width="300" height="360" rx="10" fill="#e7f5ff" stroke="#004085" stroke-width="2" stroke-dasharray="5,5" />
    
    <!-- Feed Forward -->
    <rect x="170" y="125" width="160" height="35" rx="5" fill="#4dabf7" stroke="#1976d2" stroke-width="1" />
    <text x="250" y="148" font-size="14" fill="white" text-anchor="middle" font-weight="bold">Feed Forward</text>
    
    <!-- Add & Norm 2 -->
    <rect x="170" y="175" width="160" height="30" rx="5" fill="#ffe066" stroke="#fab005" stroke-width="1" />
    <text x="250" y="195" font-size="12" fill="#495057" text-anchor="middle">Add &amp; Norm</text>
    
    <!-- Self-Attention -->
    <rect x="170" y="260" width="160" height="35" rx="5" fill="#4dabf7" stroke="#1976d2" stroke-width="1" />
    <text x="250" y="283" font-size="14" fill="white" text-anchor="middle" font-weight="bold">Self-Attention</text>
    
    <!-- Add & Norm 1 -->
    <rect x="170" y="310" width="160" height="30" rx="5" fill="#ffe066" stroke="#fab005" stroke-width="1" />
    <text x="250" y="330" font-size="12" fill="#495057" text-anchor="middle">Add &amp; Norm</text>

    <!-- Input Embedding -->
    <rect x="150" y="420" width="200" height="40" rx="5" fill="#868e96" stroke="#495057" stroke-width="1" />
    <text x="250" y="445" font-size="14" fill="white" text-anchor="middle" font-weight="bold">Input Embedding</text>
    
    <!-- Main Flow Arrows -->
    <line x1="250" y1="420" x2="250" y2="340" stroke="#495057" stroke-width="2" marker-end="url(#arrowhead)" />
    <line x1="250" y1="310" x2="250" y2="295" stroke="#495057" stroke-width="2" marker-end="url(#arrowhead)" />
    <line x1="250" y1="260" x2="250" y2="205" stroke="#495057" stroke-width="2" marker-end="url(#arrowhead)" />
    <line x1="250" y1="175" x2="250" y2="160" stroke="#495057" stroke-width="2" marker-end="url(#arrowhead)" />
    <line x1="250" y1="125" x2="250" y2="105" stroke="#495057" stroke-width="2" marker-end="url(#arrowhead)" />

    <!-- RESIDUAL 1: Bypassing Self-Attention -->
    <path d="M 170 335 L 140 335 L 140 320 L 140 265 L 170 265" fill="none" stroke="#e8590c" stroke-width="2.5" stroke-dasharray="8,4" marker-end="url(#arrowhead-res)" />
    <text x="110" y="300" font-size="11" fill="#e8590c" text-anchor="middle" font-weight="bold">Skip</text>

    <!-- RESIDUAL 2: Bypassing Feed Forward -->
    <path d="M 330 200 L 360 200 L 360 185 L 360 130 L 330 130" fill="none" stroke="#e8590c" stroke-width="2.5" stroke-dasharray="8,4" marker-end="url(#arrowhead-res)" />
    <text x="390" y="165" font-size="11" fill="#e8590c" text-anchor="middle" font-weight="bold">Skip</text>
  </g>

  <!-- ========================================== -->
  <!-- DECODER (Right Side) -->
  <!-- ========================================== -->
  <g id="decoder">
    <text x="550" y="100" font-size="18" font-weight="bold" fill="#6610f2" text-anchor="middle">Decoder</text>

    <!-- Container -->
    <rect x="400" y="110" width="300" height="360" rx="10" fill="#f5f3ff" stroke="#6610f2" stroke-width="2" stroke-dasharray="5,5" />
    
    <!-- Linear & Softmax -->
    <rect x="470" y="125" width="160" height="30" rx="5" fill="#845ef7" stroke="#5c3baa" stroke-width="1" />
    <text x="550" y="145" font-size="13" fill="white" text-anchor="middle" font-weight="bold">Linear &amp; Softmax</text>

    <!-- Feed Forward -->
    <rect x="470" y="185" width="160" height="35" rx="5" fill="#845ef7" stroke="#5c3baa" stroke-width="1" />
    <text x="550" y="208" font-size="14" fill="white" text-anchor="middle" font-weight="bold">Feed Forward</text>
    
    <!-- Add & Norm 3 -->
    <rect x="470" y="235" width="160" height="30" rx="5" fill="#ffe066" stroke="#fab005" stroke-width="1" />
    <text x="550" y="255" font-size="12" fill="#495057" text-anchor="middle">Add &amp; Norm</text>

    <!-- Cross-Attention -->
    <rect x="470" y="300" width="160" height="35" rx="5" fill="#9775fa" stroke="#5c3baa" stroke-width="1" />
    <text x="550" y="323" font-size="13" fill="white" text-anchor="middle" font-weight="bold">Cross-Attention</text>

    <!-- Add & Norm 2 -->
    <rect x="470" y="350" width="160" height="30" rx="5" fill="#ffe066" stroke="#fab005" stroke-width="1" />
    <text x="550" y="370" font-size="12" fill="#495057" text-anchor="middle">Add &amp; Norm</text>

    <!-- Masked Self-Attention -->
    <rect x="470" y="390" width="160" height="35" rx="5" fill="#845ef7" stroke="#5c3baa" stroke-width="1" />
    <text x="550" y="413" font-size="13" fill="white" text-anchor="middle" font-weight="bold">Masked Self-Attention</text>

    <!-- Add & Norm 1 -->
    <rect x="470" y="440" width="160" height="30" rx="5" fill="#ffe066" stroke="#fab005" stroke-width="1" />
    <text x="550" y="460" font-size="12" fill="#495057" text-anchor="middle">Add &amp; Norm</text>

    <!-- Output Embedding -->
    <rect x="450" y="480" width="200" height="40" rx="5" fill="#868e96" stroke="#495057" stroke-width="1" />
    <text x="550" y="505" font-size="14" fill="white" text-anchor="middle" font-weight="bold">Output Embedding</text>

    <!-- Main Flow Arrows -->
    <line x1="550" y1="480" x2="550" y2="470" stroke="#495057" stroke-width="2" marker-end="url(#arrowhead)" />
    <line x1="550" y1="440" x2="550" y2="425" stroke="#495057" stroke-width="2" marker-end="url(#arrowhead)" />
    <line x1="550" y1="390" x2="550" y2="380" stroke="#495057" stroke-width="2" marker-end="url(#arrowhead)" />
    <line x1="550" y1="350" x2="550" y2="335" stroke="#495057" stroke-width="2" marker-end="url(#arrowhead)" />
    <line x1="550" y1="300" x2="550" y2="265" stroke="#495057" stroke-width="2" marker-end="url(#arrowhead)" />
    <line x1="550" y1="235" x2="550" y2="220" stroke="#495057" stroke-width="2" marker-end="url(#arrowhead)" />
    <line x1="550" y1="185" x2="550" y2="155" stroke="#495057" stroke-width="2" marker-end="url(#arrowhead)" />

    <!-- RESIDUAL 1: Bypassing Masked Self-Attention -->
    <path d="M 470 465 L 440 465 L 440 450 L 440 395 L 470 395" fill="none" stroke="#e8590c" stroke-width="2.5" stroke-dasharray="8,4" marker-end="url(#arrowhead-res)" />
    <text x="410" y="430" font-size="11" fill="#e8590c" text-anchor="middle" font-weight="bold">Skip</text>

    <!-- RESIDUAL 2: Bypassing Cross-Attention -->
    <path d="M 630 375 L 660 375 L 660 360 L 660 305 L 630 305" fill="none" stroke="#e8590c" stroke-width="2.5" stroke-dasharray="8,4" marker-end="url(#arrowhead-res)" />
    <text x="690" y="340" font-size="11" fill="#e8590c" text-anchor="middle" font-weight="bold">Skip</text>

    <!-- RESIDUAL 3: Bypassing Feed Forward -->
    <path d="M 470 260 L 440 260 L 440 245 L 440 190 L 470 190" fill="none" stroke="#e8590c" stroke-width="2.5" stroke-dasharray="8,4" marker-end="url(#arrowhead-res)" />
    <text x="410" y="225" font-size="11" fill="#e8590c" text-anchor="middle" font-weight="bold">Skip</text>
  </g>

  <!-- ========================================== -->
  <!-- CROSS ATTENTION CONNECTION -->
  <!-- ========================================== -->
  <path d="M 330 160 L 380 160 L 380 318 L 465 318" fill="none" stroke="#6f42c1" stroke-width="3" stroke-dasharray="8,4" marker-end="url(#arrowhead-cross)" />
  <text x="380" y="145" font-size="12" fill="#6f42c1" text-anchor="middle" font-weight="bold">Keys &amp; Values</text>

</svg>