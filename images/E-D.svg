<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%" style="font-family: 'Segoe UI', Arial, sans-serif; background-color: #f8f9fa;">
  
  <defs>
    <!-- Arrowhead for standard flow -->
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#495057" />
    </marker>
    <!-- Arrowhead for Cross-Attention flow -->
    <marker id="arrowhead-cross" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6f42c1" />
    </marker>
  </defs>

  <!-- Title -->
  <text x="400" y="30" font-size="24" font-weight="bold" fill="#212529" text-anchor="middle">Transformer: Encoder &amp; Decoder Architecture</text>

  <!-- ========================================== -->
  <!-- ENCODER (Left Side) -->
  <!-- ========================================== -->
  <g id="encoder">
    <text x="250" y="70" font-size="18" font-weight="bold" fill="#004085" text-anchor="middle">Encoder</text>
    
    <!-- Encoder Block Container -->
    <rect x="150" y="240" width="200" height="220" rx="10" fill="#e7f5ff" stroke="#004085" stroke-width="2" stroke-dasharray="5,5" />
    
    <!-- Feed Forward -->
    <rect x="170" y="250" width="160" height="40" rx="5" fill="#4dabf7" stroke="1976d2" stroke-width="1" />
    <text x="250" y="275" font-size="14" fill="white" text-anchor="middle" font-weight="bold">Feed Forward</text>
    
    <!-- Add & Norm -->
    <rect x="170" y="300" width="160" height="30" rx="5" fill="#dbe4eb" stroke="adb5bd" stroke-width="1" />
    <text x="250" y="320" font-size="12" fill="#495057" text-anchor="middle">Add &amp; Norm</text>
    
    <!-- Self-Attention -->
    <rect x="170" y="340" width="160" height="40" rx="5" fill="#4dabf7" stroke="1976d2" stroke-width="1" />
    <text x="250" y="365" font-size="14" fill="white" text-anchor="middle" font-weight="bold">Multi-Head Self-Attention</text>
    
    <!-- Add & Norm -->
    <rect x="170" y="390" width="160" height="30" rx="5" fill="#dbe4eb" stroke="adb5bd" stroke-width="1" />
    <text x="250" y="410" font-size="12" fill="#495057" text-anchor="middle">Add &amp; Norm</text>

    <!-- Input Embedding -->
    <rect x="150" y="470" width="200" height="40" rx="5" fill="#868e96" stroke="#495057" stroke-width="1" />
    <text x="250" y="495" font-size="14" fill="white" text-anchor="middle" font-weight="bold">Input Embedding</text>
    
    <!-- Arrows for Encoder -->
    <line x1="250" y1="470" x2="250" y2="420" stroke="#495057" stroke-width="2" marker-end="url(#arrowhead)" />
    <line x1="250" y1="380" x2="250" y2="330" stroke="#495057" stroke-width="2" marker-end="url(#arrowhead)" />
    <line x1="250" y1="300" x2="250" y2="290" stroke="#495057" stroke-width="2" marker-end="url(#arrowhead)" />
    <line x1="250" y1="250" x2="250" y2="230" stroke="#495057" stroke-width="2" marker-end="url(#arrowhead)" />
  </g>

  <!-- Input Text -->
  <text x="250" y="535" font-size="14" fill="#212529" text-anchor="middle" font-style="italic">[Input Sequence: e.g., "Hello"]</text>


  <!-- ========================================== -->
  <!-- DECODER (Right Side) -->
  <!-- ========================================== -->
  <g id="decoder">
    <text x="550" y="70" font-size="18" font-weight="bold" fill="#6610f2" text-anchor="middle">Decoder</text>

    <!-- Decoder Block Container -->
    <rect x="450" y="110" width="200" height="350" rx="10" fill="#f5f3ff" stroke="#6610f2" stroke-width="2" stroke-dasharray="5,5" />
    
    <!-- Linear -->
    <rect x="470" y="125" width="160" height="35" rx="5" fill="#845ef7" stroke="#5c3baa" stroke-width="1" />
    <text x="550" y="148" font-size="14" fill="white" text-anchor="middle" font-weight="bold">Linear Layer</text>
    
    <!-- Softmax -->
    <rect x="470" y="170" width="160" height="35" rx="5" fill="#b197fc" stroke="#5c3baa" stroke-width="1" />
    <text x="550" y="193" font-size="14" fill="white" text-anchor="middle" font-weight="bold">Softmax</text>

    <!-- Feed Forward -->
    <rect x="470" y="230" width="160" height="35" rx="5" fill="#845ef7" stroke="#5c3baa" stroke-width="1" />
    <text x="550" y="253" font-size="14" fill="white" text-anchor="middle" font-weight="bold">Feed Forward</text>
    
    <!-- Add & Norm -->
    <rect x="470" y="275" width="160" height="25" rx="5" fill="#dbe4eb" stroke="adb5bd" stroke-width="1" />
    <text x="550" y="293" font-size="12" fill="#495057" text-anchor="middle">Add &amp; Norm</text>

    <!-- Cross-Attention -->
    <rect x="470" y="315" width="160" height="35" rx="5" fill="#9775fa" stroke="#5c3baa" stroke-width="1" />
    <text x="550" y="338" font-size="14" fill="white" text-anchor="middle" font-weight="bold">Cross-Attention</text>

    <!-- Add & Norm -->
    <rect x="470" y="360" width="160" height="25" rx="5" fill="#dbe4eb" stroke="adb5bd" stroke-width="1" />
    <text x="550" y="378" font-size="12" fill="#495057" text-anchor="middle">Add &amp; Norm</text>

    <!-- Masked Self-Attention -->
    <rect x="470" y="395" width="160" height="35" rx="5" fill="#845ef7" stroke="#5c3baa" stroke-width="1" />
    <text x="550" y="418" font-size="13" fill="white" text-anchor="middle" font-weight="bold">Masked Self-Attention</text>

    <!-- Output Embedding -->
    <rect x="450" y="470" width="200" height="40" rx="5" fill="#868e96" stroke="#495057" stroke-width="1" />
    <text x="550" y="495" font-size="14" fill="white" text-anchor="middle" font-weight="bold">Output Embedding</text>
    <text x="550" y="535" font-size="14" fill="#212529" text-anchor="middle" font-style="italic">[Shifted Output: e.g., "&lt;start&gt;"]</text>

    <!-- Arrows for Decoder (Bottom to Top) -->
    <line x1="550" y1="470" x2="550" y2="430" stroke="#495057" stroke-width="2" marker-end="url(#arrowhead)" />
    <line x1="550" y1="395" x2="550" y2="385" stroke="#495057" stroke-width="2" marker-end="url(#arrowhead)" />
    <line x1="550" y1="360" x2="550" y2="350" stroke="#495057" stroke-width="2" marker-end="url(#arrowhead)" />
    <line x1="550" y1="315" x2="550" y2="300" stroke="#495057" stroke-width="2" marker-end="url(#arrowhead)" />
    <line x1="550" y1="275" x2="550" y2="265" stroke="#495057" stroke-width="2" marker-end="url(#arrowhead)" />
    <line x1="550" y1="230" x2="550" y2="205" stroke="#495057" stroke-width="2" marker-end="url(#arrowhead)" />
    <line x1="550" y1="170" x2="550" y2="160" stroke="#495057" stroke-width="2" marker-end="url(#arrowhead)" />
  </g>

  <!-- ========================================== -->
  <!-- CROSS ATTENTION CONNECTION -->
  <!-- ========================================== -->
  <!-- Arrow from Encoder top to Decoder Cross-Attention -->
  <path d="M 350 240 L 400 240 L 400 332 L 465 332" fill="none" stroke="#6f42c1" stroke-width="3" stroke-dasharray="8,4" marker-end="url(#arrowhead-cross)" />
  <text x="400" y="225" font-size="12" fill="#6f42c1" text-anchor="middle" font-weight="bold">Keys &amp; Values</text>

</svg>